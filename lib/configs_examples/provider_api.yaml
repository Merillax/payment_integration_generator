openapi: 3.1.0
info:
  title: DemoPay API
  description: >
    Тестовая спецификация платёжного провайдера для хакатона.
    Содержит все ключевые элементы: методы, параметры, авторизацию,
    статусы, ошибки и вебхуки (уведомления).
  version: "1.2.0"
  contact:
    name: DemoPay Support
    email: support@demopay.example.com

servers:
  - url: https://api.demopay.example.com/v1
    description: Production
  - url: https://sandbox.demopay.example.com/v1
    description: Sandbox

# =========================================================
# АВТОРИЗАЦИЯ
# =========================================================
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Простой API-ключ, передаётся в заголовке каждого запроса

    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth2-токен, получается отдельным эндпоинтом /auth/token

    WebhookSignature:
      type: apiKey
      in: header
      name: X-DemoPay-Signature
      description: >
        HMAC-SHA256 подпись тела вебхука. Не является "авторизацией" запроса
        в классическом смысле, но используется для проверки подлинности уведомлений.

  # =========================================================
  # СХЕМЫ ДАННЫХ (DTO)
  # =========================================================
  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          description: Сумма в минимальных единицах валюты (копейки/центы)
          example: 15000
        currency:
          type: string
          description: Код валюты ISO 4217
          enum: [RUB, USD, EUR]
          example: RUB

    PaymentStatus:
      type: string
      description: Текущий статус платежа
      enum: [pending, processing, succeeded, failed, refunded, canceled]

    PaymentMethod:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [card, sbp, wallet]
        card_last4:
          type: string
          description: Последние 4 цифры карты (если type=card)
          example: "4242"

    Payment:
      type: object
      required: [payment_id, status, amount, currency, created_at]
      properties:
        payment_id:
          type: string
          example: "pay_9f8a7b6c"
        order_id:
          type: string
          example: "order_12345"
        status:
          $ref: "#/components/schemas/PaymentStatus"
        amount:
          type: integer
          example: 15000
        currency:
          type: string
          example: RUB
        payment_method:
          $ref: "#/components/schemas/PaymentMethod"
        description:
          type: string
          example: "Оплата заказа №12345"
        created_at:
          type: string
          format: date-time
          example: "2026-08-22T10:15:30Z"
        confirmation_url:
          type: string
          description: Ссылка для подтверждения оплаты пользователем (3DS/редирект)
          example: "https://sandbox.demopay.example.com/confirm/pay_9f8a7b6c"

    CreatePaymentRequest:
      type: object
      required: [amount, currency, order_id]
      properties:
        amount:
          type: integer
          example: 15000
        currency:
          type: string
          enum: [RUB, USD, EUR]
          example: RUB
        order_id:
          type: string
          example: "order_12345"
        description:
          type: string
          example: "Оплата заказа №12345"
        return_url:
          type: string
          description: Куда вернуть пользователя после оплаты
          example: "https://shop.example.com/order/12345/success"
        capture:
          type: boolean
          description: Автоматически списывать средства (true) или только заблокировать (false)
          default: true

    RefundRequest:
      type: object
      required: [payment_id, amount]
      properties:
        payment_id:
          type: string
          example: "pay_9f8a7b6c"
        amount:
          type: integer
          description: Сумма возврата в минимальных единицах
          example: 5000
        reason:
          type: string
          example: "Клиент отказался от товара"

    Refund:
      type: object
      required: [refund_id, payment_id, status, amount]
      properties:
        refund_id:
          type: string
          example: "ref_1a2b3c"
        payment_id:
          type: string
          example: "pay_9f8a7b6c"
        status:
          type: string
          enum: [pending, succeeded, failed]
        amount:
          type: integer
          example: 5000

    Error:
      type: object
      required: [error_code, message]
      properties:
        error_code:
          type: string
          example: "invalid_request"
        message:
          type: string
          example: "Поле amount обязательно для заполнения"
        details:
          type: object
          additionalProperties: true

  # =========================================================
  # ПЕРЕИСПОЛЬЗУЕМЫЕ ОТВЕТЫ (ошибки)
  # =========================================================
  responses:
    BadRequest:
      description: Некорректные параметры запроса
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error_code: invalid_request
            message: "Поле amount обязательно для заполнения"

    Unauthorized:
      description: Неверный или отсутствующий API-ключ / токен
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error_code: authentication_error
            message: "Неверный API-ключ"

    NotFound:
      description: Объект не найден
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error_code: not_found
            message: "Платёж с указанным ID не найден"

    RateLimited:
      description: Превышен лимит запросов
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error_code: rate_limited
            message: "Слишком много запросов, повторите позже"

    ServerError:
      description: Внутренняя ошибка провайдера
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error_code: internal_error
            message: "Внутренняя ошибка сервера, попробуйте позже"

  parameters:
    PaymentIdPath:
      name: payment_id
      in: path
      required: true
      description: Идентификатор платежа
      schema:
        type: string
      example: "pay_9f8a7b6c"

    LimitQuery:
      name: limit
      in: query
      required: false
      description: Количество записей на странице (пагинация)
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

    CursorQuery:
      name: cursor
      in: query
      required: false
      description: Курсор для пагинации (значение из предыдущего ответа)
      schema:
        type: string

# =========================================================
# ГЛОБАЛЬНАЯ АВТОРИЗАЦИЯ ПО УМОЛЧАНИЮ
# =========================================================
security:
  - ApiKeyAuth: []

# =========================================================
# МЕТОДЫ (paths)
# =========================================================
paths:
  /payments:
    post:
      operationId: createPayment
      summary: Создать платёж
      description: Создаёт новый платёж и возвращает ссылку на подтверждение оплаты.
      tags: [Payments]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: Платёж успешно создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

    get:
      operationId: listPayments
      summary: Получить список платежей
      description: Возвращает список платежей с пагинацией.
      tags: [Payments]
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/CursorQuery"
        - name: status
          in: query
          required: false
          description: Фильтр по статусу платежа
          schema:
            $ref: "#/components/schemas/PaymentStatus"
      responses:
        "200":
          description: Список платежей
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Payment"
                  next_cursor:
                    type: string
                    nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /payments/{payment_id}:
    get:
      operationId: getPayment
      summary: Получить платёж по ID
      description: Возвращает подробную информацию о конкретном платеже.
      tags: [Payments]
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/PaymentIdPath"
      responses:
        "200":
          description: Информация о платеже
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /payments/{payment_id}/capture:
    post:
      operationId: capturePayment
      summary: Подтвердить (списать) заблокированный платёж
      description: >
        Используется, если при создании платежа был передан capture=false —
        средства были заблокированы, но не списаны.
      tags: [Payments]
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/PaymentIdPath"
      responses:
        "200":
          description: Платёж подтверждён и списан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /payments/{payment_id}/cancel:
    post:
      operationId: cancelPayment
      summary: Отменить платёж
      tags: [Payments]
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/PaymentIdPath"
      responses:
        "200":
          description: Платёж отменён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404":
          $ref: "#/components/responses/NotFound"

  /refunds:
    post:
      operationId: createRefund
      summary: Создать возврат средств
      tags: [Refunds]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundRequest"
      responses:
        "201":
          description: Возврат создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/token:
    post:
      operationId: issueToken
      summary: Получить Bearer-токен по client_id/client_secret
      description: Отдельный метод авторизации по OAuth2 client_credentials flow.
      tags: [Auth]
      security: []   # этот метод не требует авторизации — сам её выдаёт
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, client_secret]
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
      responses:
        "200":
          description: Токен выдан
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  expires_in:
                    type: integer
                    example: 3600
        "401":
          $ref: "#/components/responses/Unauthorized"
